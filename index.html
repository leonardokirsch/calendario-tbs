<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendário de conteúdo — The Best Speaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E8ECF4;
  --bg-2:#D9E0EE;
  --ink:#101B3D;
  --ink-soft:#56628A;
  --ink-faint:#8E98B6;
  --glass:rgba(255,255,255,.55);
  --glass-strong:rgba(255,255,255,.82);
  --line:rgba(16,27,61,.10);
  --cell-hover:rgba(16,27,61,.05);
  --orb-a:rgba(255,122,26,.35);
  --orb-b:rgba(90,122,220,.35);
  --shadow:0 40px 80px -30px rgba(16,27,61,.35);
  --hot-1:#FF8A1F;
  --hot-2:#FF4D2E;
  --on-hot:#FFFFFF;
  --st-0:#9AA3BD;
  --st-1:#F2B33D;
  --st-2:#4C7DF0;
  --st-3:#2FB47C;
  --field:rgba(255,255,255,.7);
  --draft:rgba(255,255,255,.75);
  --draft-hover:rgba(255,255,255,.95);
  --scrim:rgba(16,27,61,.35);
  --ev-mont:#2FA8A0;
  --ev-grav:#7B6CF0;
  --ev-final:#E2457E;
  --font:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1430;--bg-2:#121D44;--ink:#F2F4FA;--ink-soft:#A8B2CF;--ink-faint:#6E7AA0;
    --glass:rgba(255,255,255,.06);--glass-strong:rgba(22,32,72,.92);--line:rgba(255,255,255,.09);
    --cell-hover:rgba(255,255,255,.05);--orb-a:rgba(255,110,30,.30);--orb-b:rgba(70,100,220,.35);
    --shadow:0 40px 90px -30px rgba(0,0,0,.6);--field:rgba(255,255,255,.06);--scrim:rgba(5,9,25,.6);--draft:rgba(255,255,255,.075);--draft-hover:rgba(255,255,255,.12);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1430;--bg-2:#121D44;--ink:#F2F4FA;--ink-soft:#A8B2CF;--ink-faint:#6E7AA0;
  --glass:rgba(255,255,255,.06);--glass-strong:rgba(22,32,72,.92);--line:rgba(255,255,255,.09);
  --cell-hover:rgba(255,255,255,.05);--orb-a:rgba(255,110,30,.30);--orb-b:rgba(70,100,220,.35);
  --shadow:0 40px 90px -30px rgba(0,0,0,.6);--field:rgba(255,255,255,.06);--scrim:rgba(5,9,25,.6);--draft:rgba(255,255,255,.075);--draft-hover:rgba(255,255,255,.12);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font-family:var(--font);color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
.orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.7}
.orbs i:nth-child(1){width:46vmax;height:46vmax;background:var(--orb-a);top:-18vmax;right:-12vmax}
.orbs i:nth-child(2){width:52vmax;height:52vmax;background:var(--orb-b);bottom:-26vmax;left:-16vmax}

.page{position:relative;z-index:1;flex:1 0 auto;width:100%;max-width:1100px;margin:0 auto;padding:24px 24px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
body{display:flex;flex-direction:column}
.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 22px);left:28px;right:28px;width:auto;z-index:2}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;
  border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  font-size:13px;font-weight:500;color:var(--ink-soft);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--hot-1),var(--hot-2))}

.card{width:100%;max-width:750px;border-radius:28px;padding:28px 28px 22px;background:var(--glass);
  border:1px solid var(--line);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);
  box-shadow:var(--shadow)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.month{font-weight:800;font-stretch:118%;font-variation-settings:"wdth" 118;font-size:clamp(36px,5vw,52px);
  line-height:.88;letter-spacing:-.035em;margin:0}
.year{font-weight:300;font-size:clamp(16px,2vw,20px);color:var(--ink-soft);letter-spacing:-.01em;margin-left:.15em}
.nav{display:flex;gap:8px;flex-shrink:0}
.nav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--glass);
  color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:background .15s}
.nav button:hover{background:var(--cell-hover)}
.nav svg{width:15px;height:15px}

.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.head,.grid{max-width:504px;margin-left:auto;margin-right:auto}
.wd{font-size:12px;font-weight:500;color:var(--ink-faint);text-align:center;padding:2px 0 8px;line-height:1.25}
.day{position:relative;height:58px;border-radius:14px;border:1px solid transparent;
  background:transparent;color:var(--ink);font:inherit;cursor:pointer;padding:0;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:background .15s,border-color .15s,transform .15s}
.day:hover{background:var(--cell-hover);border-color:var(--line)}
.day:focus-visible,.nav button:focus-visible,.btn:focus-visible,.close:focus-visible{outline:2px solid var(--hot-1);outline-offset:2px}
.day .n{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.day.out{visibility:hidden;pointer-events:none}
.day.today::after{content:"";position:absolute;inset:3px;border-radius:11px;border:1.5px solid var(--ink-soft);pointer-events:none}
.day .meta{display:flex;align-items:center;justify-content:center;gap:3px;height:12px;max-width:100%;padding:0 3px}
.day .fmt{font-size:10px;font-weight:600;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .fmt-s{display:none}
.day .sd{position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%}

.day.feed{background:linear-gradient(145deg,var(--hot-1),var(--hot-2));color:var(--on-hot);
  box-shadow:0 10px 20px -12px rgba(255,77,46,.65)}
.day.feed:hover{transform:translateY(-2px);background:linear-gradient(145deg,var(--hot-1),var(--hot-2));border-color:transparent}
.day.feed .sd{box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.day.feed.today::after{border-color:rgba(255,255,255,.9)}
.day.story{border-color:rgba(255,122,31,.55);background:var(--glass)}
.day.draft{background:var(--draft);border-color:transparent;cursor:pointer}
.day.draft:hover{background:var(--draft-hover);border-color:transparent}
.day.draft .fmt,.day.draft .fmt-s{color:var(--ink-soft);font-weight:500}
.day.draft .sd{display:none}
.day.story .fmt{color:var(--ink-soft);font-weight:500}

.day.locked{color:var(--ink-faint)}
.day.locked:hover{background:var(--cell-hover)}
.day .evs{position:absolute;left:14px;right:14px;bottom:5px;height:3px;display:flex;gap:3px}
.day .evs i{flex:1;border-radius:2px;opacity:.9}
.ev-mont{background:var(--ev-mont)}.ev-grav{background:var(--ev-grav)}.ev-final{background:var(--ev-final)}
.day.feed .evs i{box-shadow:0 0 0 1px rgba(255,255,255,.55)}
.legend .bar{width:12px;height:3px;border-radius:2px}
.nav button:disabled{opacity:.3;cursor:default}
.nav button:disabled:hover{background:var(--glass)}
.day .lock{width:11px;height:11px;opacity:.75}
.mini{position:fixed;z-index:21;left:50%;top:50%;width:min(360px,calc(100% - 32px));transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;
  transition:transform .22s ease,opacity .2s;background:var(--glass-strong);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);padding:26px 24px 20px;text-align:center}
.mini.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.mini .ic{width:44px;height:44px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;border:1px solid var(--line);color:var(--ink-soft)}
.mini .ic svg{width:18px;height:18px}
.mini h2{margin:0 0 6px;font-size:20px;font-weight:700;letter-spacing:-.01em}
.mini p{margin:0 0 18px;font-size:14px;line-height:1.5;color:var(--ink-soft)}
.legend{display:flex;flex-wrap:nowrap;white-space:nowrap;overflow-x:auto;scrollbar-width:none;justify-content:safe center;gap:7px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);
  font-size:10.5px;color:var(--ink-soft)}
.legend::-webkit-scrollbar{display:none}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .sw{width:11px;height:11px;border-radius:4px}
.legend .sw.feed{background:linear-gradient(145deg,var(--hot-1),var(--hot-2))}
.legend .sw.story{border:1.5px solid var(--hot-1)}
.legend .sw.draft{background:var(--ink-faint);opacity:.45}
.legend .sd{width:6px;height:6px;border-radius:50%}
.legend .gap{width:1px;height:12px;background:var(--line);align-self:center}
.note{font-size:12px;color:var(--ink-faint);text-align:center;max-width:52ch;line-height:1.5;margin:0}

/* Modal */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:21;left:50%;top:50%;width:min(620px,calc(100% - 32px));max-height:calc(100% - 48px);
  transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;transition:transform .22s ease,opacity .2s;
  background:var(--glass-strong);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);display:flex;flex-direction:column;overflow:hidden}
.sheet.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.sh-head{padding:24px 26px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line)}
.sh-date{font-weight:800;font-variation-settings:"wdth" 115;font-size:30px;letter-spacing:-.025em;line-height:1;margin:0}
.sh-sub{margin:8px 0 0;font-size:14px;color:var(--ink-soft)}
.close{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center;flex-shrink:0}
.close svg{width:16px;height:16px}
.sh-body{padding:20px 26px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:14px 14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:13px;font-weight:600;color:var(--ink-soft)}
.f input,.f select,.f textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--field);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;width:100%;resize:vertical}
.f textarea{min-height:84px;line-height:1.5;white-space:pre-wrap}
.f textarea.tall{min-height:140px}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--hot-1);box-shadow:0 0 0 3px rgba(255,138,31,.2)}
.f select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.f input[readonly],.f select:disabled,.f textarea[readonly]{opacity:.8}
.toggle{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--field);cursor:pointer}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggle .tg{width:38px;height:22px;border-radius:999px;background:var(--ink-faint);position:relative;flex-shrink:0;transition:background .15s}
.toggle .tg::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle input:checked+.tg{background:linear-gradient(135deg,var(--hot-1),var(--hot-2))}
.toggle input:checked+.tg::after{transform:translateX(16px)}
.toggle input:focus-visible+.tg{outline:2px solid var(--hot-1);outline-offset:2px}
.toggle b{display:block;font-size:14px;font-weight:600}
.toggle small{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.sh-foot{padding:16px 26px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.msg{font-size:13px;color:var(--ink-soft)}
.btns{display:flex;gap:10px}
.btn{font:inherit;font-size:15px;font-weight:600;border-radius:999px;padding:11px 20px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink)}
.btn.primary{border:0;color:var(--on-hot);background:linear-gradient(135deg,var(--hot-1),var(--hot-2))}
.btn.primary:disabled{opacity:.5;cursor:default}
.btn.ghost{color:var(--ink-soft)}

@media (max-width:640px){
  .page{padding:72px 12px 28px;justify-content:flex-start}
  .top{left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 14px)}
  .card{padding:20px 14px 18px;border-radius:24px}
  .head{margin-bottom:18px}
  .nav button{width:38px;height:38px}
  .grid{gap:4px}
  .day{border-radius:11px;height:48px}
  .day .fmt{display:none}
  .day .fmt-s{display:inline;font-size:9.5px;font-weight:600}
  .day .meta{gap:3px;padding:0 2px}
  .wd{font-size:11px}
  .legend{justify-content:flex-start}
  .pill{font-size:12px;padding:6px 11px}
  .sheet{left:0;right:0;top:auto;bottom:0;width:100%;max-height:92%;transform:translateY(24px);border-radius:24px 24px 0 0;
    padding-bottom:env(safe-area-inset-bottom,0px)}
  .sheet.open{transform:translateY(0)}
  .sh-body{grid-template-columns:1fr;padding:18px}
  .sh-head,.sh-foot{padding-left:18px;padding-right:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.toggle input:disabled+.tg{opacity:1}
.sheet .toggle{cursor:default}
</style>
</head>
<body>
<div class="orbs" aria-hidden="true"><i></i><i></i></div>

<main class="page">
  <div class="top">
    <span class="pill"><span class="dot"></span>The Best Speaker</span>
    <span class="pill" id="count">Carregando…</span>
  </div>

  <section class="card" aria-label="Calendário de conteúdo">
    <div class="head">
      <h1 class="month"><span id="mName">Outubro</span><span class="year" id="mYear">2026</span></h1>
      <div class="nav">
        <button id="prev" aria-label="Mês anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button id="next" aria-label="Próximo mês"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </div>
    <div class="grid" id="grid" role="grid"></div>
    <div class="legend">
      <span><i class="sw feed"></i>Feed</span>
      <span><i class="sw story"></i>Stories</span>
      <span><i class="sw draft"></i>Em revisão</span>
      <span class="gap"></span>
      <span><i class="sd" style="background:var(--st-0)"></i>A produzir</span>
      <span><i class="sd" style="background:var(--st-1)"></i>Em produção</span>
      <span><i class="sd" style="background:var(--st-2)"></i>Pronto</span>
      <span><i class="sd" style="background:var(--st-3)"></i>Publicado</span>
      <span class="gap"></span>
      <span><i class="bar ev-mont"></i>Montagem</span>
      <span><i class="bar ev-grav"></i>Gravações</span>
      <span><i class="bar ev-final"></i>Final</span>
    </div>
  </section>
  <p class="note" id="note">Em laranja, os posts já revisados e aprovados. Clique em um dia para ver os detalhes.</p>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shDate">
  <div class="sh-head">
    <div>
      <p class="sh-date" id="shDate">—</p>
      <p class="sh-sub" id="shSub"></p>
    </div>
    <button class="close" id="close" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="sh-body">
    <label class="toggle full" for="fAprovado"><input type="checkbox" id="fAprovado"><span class="tg"></span><span><b>Aprovado</b><small>Revisado e liberado para produção</small></span></label>
    <div class="f full"><label for="fCapa">Título de capa</label><input id="fCapa" placeholder="O texto que aparece na capa do reel"></div>
    <div class="f"><label for="fFormato">Formato</label>
      <select id="fFormato"><option>Reel</option><option>Carrossel</option><option>Foto</option><option>Stories</option></select></div>
    <div class="f"><label for="fStatus">Status</label>
      <select id="fStatus"><option>A produzir</option><option>Em produção</option><option>Pronto</option><option>Publicado</option></select></div>
    <div class="f full"><label for="fTitulo">Pauta</label><textarea id="fTitulo" placeholder="Sobre o que é o post"></textarea></div>
    <div class="f full"><label for="fBriefing">Briefing</label><textarea id="fBriefing" placeholder="Objetivo, referências, tom, o que precisa aparecer"></textarea></div>
    <div class="f full"><label for="fRoteiro">Roteiro / copy</label><textarea id="fRoteiro" class="tall" placeholder="Roteiro do vídeo, falas, legenda"></textarea></div>
    <div class="f"><label for="fDepende">Depende de</label><input id="fDepende" placeholder="Captação ou aprovação"></div>
    <div class="f"><label for="fResp">Responsável</label><input id="fResp" placeholder="Quem produz"></div>
  </div>
  <div class="sh-foot">
    <span class="msg" id="msg"></span>
    <div class="btns">
      <button class="btn ghost" id="del">Remover post</button>
      <button class="btn primary" id="save">Salvar</button>
    </div>
  </div>
</div>

<div class="mini" id="mini" role="dialog" aria-modal="true" aria-labelledby="miniT">
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
  <h2 id="miniT">Em desenvolvimento</h2>
  <p id="miniP">Os conteúdos deste período ainda estão sendo planejados.</p>
  <button class="btn primary" id="miniOk">Entendi</button>
</div>

<script>
(function(){
  const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const WD=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  const WDL=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
  const ST={'A produzir':'var(--st-0)','Em produção':'var(--st-1)','Pronto':'var(--st-2)','Publicado':'var(--st-3)'};
  const FIELDS=[['capa','fCapa'],['formato','fFormato'],['status','fStatus'],['titulo','fTitulo'],['briefing','fBriefing'],
    ['roteiro','fRoteiro'],['depende','fDepende'],['responsavel','fResp']];
  const $=id=>document.getElementById(id);

  let posts={};          // date -> data
  let db=null, canWrite=true, ready=false;
  const now=new Date();
  let view={y:2026,m:9};  // outubro
  if(now.getFullYear()===2026 && now.getMonth()>=9 && now.getMonth()<=11) view={y:2026,m:now.getMonth()};
  let current=null;       // date being edited

  const LOCKED=[['2026-11-09','2026-11-12'],['2026-11-15','2026-11-30'],['2026-12-01','2026-12-31']];
  const EVENTS=[{a:'2026-11-13',b:'2026-11-14',c:'ev-mont',n:'montagem do espaço'},{a:'2026-11-14',b:'2026-11-18',c:'ev-grav',n:'gravações do reality'},{a:'2026-11-21',b:'2026-11-21',c:'ev-final',n:'final do reality'}];
  const MINV=2026*12+9, MAXV=2026*12+11;
  function addEv(b,k){ const ev=EVENTS.filter(e=>k>=e.a&&k<=e.b); if(!ev.length) return '';
    const w=document.createElement('span'); w.className='evs'; ev.forEach(e=>{const i=document.createElement('i'); i.className=e.c; w.appendChild(i)}); b.appendChild(w);
    return ' ('+ev.map(e=>e.n).join(', ')+')'; }
  const isLocked=k=>LOCKED.some(([a,b])=>k>=a&&k<=b);
  const pad=n=>String(n).padStart(2,'0');
  const key=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
  const todayKey=key(now.getFullYear(),now.getMonth(),now.getDate());

  function render(){
    $('mName').textContent=MONTHS[view.m];
    $('prev').disabled=view.y*12+view.m<=MINV; $('next').disabled=view.y*12+view.m>=MAXV;
    $('mYear').textContent=view.y;
    const g=$('grid'); g.textContent='';
    WD.forEach(w=>{const e=document.createElement('div');e.className='wd';e.textContent=w;g.appendChild(e)});
    const first=new Date(view.y,view.m,1);
    const lead=(first.getDay()+6)%7;
    const days=new Date(view.y,view.m+1,0).getDate();
    for(let i=0;i<lead;i++){const e=document.createElement('div');e.className='day out';g.appendChild(e)}
    let feedCount=0;
    for(let d=1;d<=days;d++){
      const k=key(view.y,view.m,d), p=posts[k];
      const b=document.createElement('button'); b.className='day'; b.type='button';
      if(k===todayKey) b.classList.add('today');
      const n=document.createElement('span'); n.className='n'; n.textContent=d; b.appendChild(n);
      let label=WDL[new Date(view.y,view.m,d).getDay()]+', '+d+' de '+MONTHS[view.m].toLowerCase();
      if(isLocked(k)){
        b.classList.add('locked');
        const meta=document.createElement('span'); meta.className='meta'; meta.innerHTML='<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'; b.appendChild(meta);
        b.setAttribute('aria-label',label+addEv(b,k)+': em desenvolvimento');
        b.addEventListener('click',openMini); g.appendChild(b); continue;
      }
      if(p){
        const isFeed=p.formato && p.formato!=='Stories';
        if(p.aprovado===true){ b.classList.add(isFeed?'feed':'story'); if(isFeed) feedCount++; }
        else b.classList.add('draft');
        const meta=document.createElement('span'); meta.className='meta';
        const sd=document.createElement('i'); sd.className='sd'; sd.style.background=ST[p.status]||ST['A produzir'];
        const f=document.createElement('span'); f.className='fmt'; f.textContent=p.formato||'';
        const fs=document.createElement('span'); fs.className='fmt-s'; fs.textContent=({Carrossel:'Carr.',Stories:'Story'})[p.formato]||p.formato||'';
        meta.appendChild(sd); meta.appendChild(f); meta.appendChild(fs); b.appendChild(meta);
        label+=': '+(p.formato||'')+(p.aprovado===true?', aprovado, '+(p.status||'A produzir'):', em revisão')+'. '+(p.capa||p.titulo||'');
      } else label+=': sem post';
      b.setAttribute('aria-label',label+addEv(b,k));
      b.addEventListener('click',()=>openSheet(k));
      g.appendChild(b);
    }
    $('count').textContent=ready ? (feedCount+(feedCount===1?' post aprovado':' posts aprovados')+' no feed em '+MONTHS[view.m].toLowerCase()) : 'Carregando…';
  }

  function fmtDate(k){
    const [y,m,d]=k.split('-').map(Number); const dt=new Date(y,m-1,d);
    return {big:d+' de '+MONTHS[m-1].toLowerCase(), wd:WDL[dt.getDay()]};
  }

  function openSheet(k){
    current=k; const p=posts[k]; const fd=fmtDate(k);
    $('shDate').textContent=fd.big.charAt(0).toUpperCase()+fd.big.slice(1);
    const isFeedP=p&&p.formato&&p.formato!=='Stories';
    $('shSub').textContent=fd.wd.charAt(0).toUpperCase()+fd.wd.slice(1)+(p&&p.fase?(' — Fase '+p.fase+(p.semana?', semana '+p.semana:'')):(p?'':' — dia sem post'))+(isFeedP?'. Repost nos stories no mesmo dia.':'');
    FIELDS.forEach(([f,id])=>{const el=$(id); el.value=(p&&p[f])||(f==='formato'?'Reel':f==='status'?'A produzir':'');
      if(el.tagName==='SELECT') el.disabled=!canWrite; else el.readOnly=!canWrite;});
    $('fAprovado').checked=!!(p&&p.aprovado===true); $('fAprovado').disabled=true;
    $('del').style.display=(p&&canWrite)?'':'none';
    $('save').style.display=canWrite?'':'none';
    $('save').textContent=p?'Salvar':'Criar post';
    $('save').disabled=false;
    $('msg').textContent='';
    $('scrim').classList.add('open'); $('sheet').classList.add('open');
    requestAnimationFrame(()=>document.querySelectorAll('.sheet textarea').forEach(fit));
    setTimeout(()=>$('fCapa').focus({preventScroll:true}),60);
  }
  let miniOpen=false;
  function openMini(){ miniOpen=true; $('scrim').classList.add('open'); $('mini').classList.add('open'); setTimeout(()=>$('miniOk').focus(),60); }
  function closeMini(){ miniOpen=false; $('mini').classList.remove('open'); if(!current) $('scrim').classList.remove('open'); }
  function closeSheet(){ $('scrim').classList.remove('open'); $('sheet').classList.remove('open'); current=null; }

  async function save(){
    if(!db||!current) return;
    const k=current; const base=posts[k]||{date:k};
    const data=Object.assign({},base);
    FIELDS.forEach(([f,id])=>data[f]=$(id).value.trim());
    data.aprovado=$('fAprovado').checked;
    data.date=k; data.updatedAt=new Date().toISOString();
    $('save').disabled=true; $('msg').textContent='Salvando…';
    try{
      await db.collection('posts').doc(k).set(data);
      posts[k]=data; render();
      $('msg').textContent='Salvo'; $('save').textContent='Salvar';
      $('del').style.display='';
    }catch(e){
      if(e&&e.code==='invalid_argument'){canWrite=false;$('msg').textContent='Você só tem acesso de leitura.'}
      else $('msg').textContent='Não foi possível salvar. Tente de novo.';
    }finally{$('save').disabled=false}
  }
  async function remove(){
    if(!db||!current||!posts[current]) return;
    if(!confirm('Remover o post deste dia?')) return;
    try{ await db.collection('posts').doc(current).delete(); delete posts[current]; render(); closeSheet(); }
    catch(e){ $('msg').textContent='Não foi possível remover.'; }
  }

  function fit(t){t.style.height='auto';t.style.height=Math.min(Math.max(t.scrollHeight+2,84),520)+'px'}
  document.querySelectorAll('.sheet textarea').forEach(t=>t.addEventListener('input',()=>fit(t)));
  $('prev').onclick=()=>{ if(view.y*12+view.m<=MINV) return; view.m--; if(view.m<0){view.m=11;view.y--} render()};
  $('next').onclick=()=>{ if(view.y*12+view.m>=MAXV) return; view.m++; if(view.m>11){view.m=0;view.y++} render()};
  $('close').onclick=closeSheet; $('scrim').onclick=()=>{ if(miniOpen) closeMini(); else closeSheet(); }; $('miniOk').onclick=closeMini;
  $('save').onclick=save; $('del').onclick=remove;
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ if(miniOpen) closeMini(); else if(current) closeSheet(); }
    if(!current&&!miniOpen&&!e.target.closest('input,textarea,select')){
      if(e.key==='ArrowLeft') $('prev').click();
      if(e.key==='ArrowRight') $('next').click();
    }
  });

  render();
